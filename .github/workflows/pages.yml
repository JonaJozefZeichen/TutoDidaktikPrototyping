# Baut die Demo (nur Beispielaufgaben, läuft ohne Server) und veröffentlicht sie
# auf GitHub Pages. Einmalig nötig: Settings → Pages → Source: "GitHub Actions".
name: Demo auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - name: Demo bauen
        working-directory: app
        run: flutter build web --release --dart-define=DEMO=true --no-web-resources-cdn --base-href /TutoDidaktikPrototyping/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
